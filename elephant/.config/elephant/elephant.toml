# Elephant (walker's backend) global config.
#
# The launch prefix is PINNED rather than autodetected. Autodetect picks the
# first of uwsm / app2unit / systemd-run it finds on PATH, and it only looks
# once at startup: on 2026-07-24 it latched onto a `uwsm-app` shim in
# ~/.local/bin, and when that shim was removed every single app launch from
# walker silently failed (elephant logs "activated=..." and nothing happens,
# because the prefix binary no longer exists).
#
# `niri msg action spawn --` is what autodetect settles on here anyway, and it
# hands the app to the compositor with the session environment.

auto_detect_launch_prefix = false
before_load = []
git_on_demand = true
ignored_providers = []
launch_prefix = 'niri msg action spawn --'
overload_local_env = false
terminal_cmd = ''

[provider_hosts]
