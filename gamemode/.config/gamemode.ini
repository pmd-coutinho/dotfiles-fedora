; Feral GameMode — user config (stowed from dotfiles/gamemode). Reference:
; /usr/share/gamemode/gamemode.ini (all keys, with defaults).
;
; Used by Flatpak Steam: the sandbox ships gamemoderun + libgamemode and talks
; to the HOST gamemoded over D-Bus (activatable, no setup). Dota 2's launch
; options are `gamemoderun %command%`.
;
; What we keep from GameMode: renice + soft realtime + I/O priority for the
; game process. What we turn off: the CPU-governor and split-lock tweaks —
; those need polkit (group `gamemode`) and, worse, GameMode's default
; `defaultgov=powersave` would fight tuned (throughput-performance keeps the
; governor at performance permanently) by flipping it to powersave after
; every game. Making both equal to what tuned already set turns them into no-ops.

[general]
; the game gets nice -10 relative to the rest of the session (default 4)
renice=10
; SCHED_ISO when supported (CachyOS BORE kernel), else nothing
softrealtime=auto
ioprio=0
; no-ops: tuned owns the governor (see setup-round2.sh power udev rule)
desiredgov=performance
defaultgov=performance
; writing /proc/sys/kernel/split_lock_mitigate also needs polkit — skip
disable_splitlock=0
; niri has no xdg-screensaver; the Sunshine game-mode prep cmd handles idle
inhibit_screensaver=0

; No [gpu] section: gamemoded refuses it in user configs, and the default
; already leaves the NVIDIA clocks alone (would need coolbits + polkit anyway).
