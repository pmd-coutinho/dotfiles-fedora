# Sunshine host config (Moonlight server) — stowed from dotfiles/sunshine.
# Reference: https://docs.lizardbyte.dev/projects/sunshine/latest/md_docs_2configuration.html
# The web UI (https://localhost:47990) rewrites this file when you save there,
# so edit here OR there, then `git diff` before committing.
#
# Display strategy: no virtual display (niri has none yet) — stream-display
# repurposes the Gigabyte M28U per stream. See stream-display next to this file.

sunshine_name = pedrocoutinho-cachy

# ── Capture / encode ─────────────────────────────────────────────────────
# KMS capture: grabs the NVIDIA scanout buffer of the M28U zero-copy into
# NVENC; needs cap_sys_admin on the binary (the rpm sets it, bootstrap
# re-applies). Fallback that is known to work on niri (Aug 2026 trial):
#   capture = wlr
#   output_name = DP-4
capture = kms
# RTX 4080 Laptop: NVENC, HEVC + AV1 capable. The client picks the codec.
encoder = nvenc
# p1 = fastest preset; at 1080p120 latency matters more than compression.
nvenc_preset = 1
nvenc_twopass = quarter_res

# ── Around each stream: display switch + game mode ───────────────────────
# `do` commands run in order before the client stream starts, `undo` in
# reverse after it ends. SUNSHINE_CLIENT_WIDTH/HEIGHT/FPS are exported.
#   stream-display: M28U → client mode, other outputs off (restored after)
#   game-mode:      DND on, caffeine on, performance profile (restored after)
global_prep_cmd = [{"do":"/home/pedrocoutinho/.config/sunshine/stream-display on","undo":"/home/pedrocoutinho/.config/sunshine/stream-display off","elevated":"false"},{"do":"/home/pedrocoutinho/.config/sunshine/game-mode on","undo":"/home/pedrocoutinho/.config/sunshine/game-mode off","elevated":"false"}]

# ── Resolution / fps ─────────────────────────────────────────────────────
# Nothing to list here: since 2025 Sunshine just honours whatever Moonlight
# asks for (the old `resolutions`/`fps` keys are gone and log a warning).
# stream-display maps the request onto a real M28U mode.

# ── Misc ─────────────────────────────────────────────────────────────────
# LAN-only: v4 only, never ask the router to expose Sunshine (UPnP), and the
# web UI (pairing, config) answers only from this machine.
address_family = ipv4
upnp = disabled
origin_web_ui_allowed = pc
min_log_level = info
